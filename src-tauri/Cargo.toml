[package]
name = "findr-desktop"
version = "0.1.0"
description = "findr desktop — fast local file search"
authors = ["Daniel Mathias"]
edition = "2021"

[lib]
name = "findr_desktop_lib"
crate-type = ["lib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "protocol-asset", "tray-icon", "image-png"] }
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
ureq = { version = "2", features = ["json"] }
sha2 = "0.10"
trash = "5.2.6"
tokio = { version = "1", features = ["time", "rt"] }
sentry = "0.42"
tauri-plugin-sentry = "0.5"
dirs = "6.0.0"

[target.'cfg(target_os = "macos")'.dependencies]
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", rev = "a3122e8" }
