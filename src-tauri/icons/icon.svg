  <line x1="158" y1="192" x2="266" y2="192" stroke="white" stroke-width="8" stroke-linecap="round" opacity="0.9"/>
  <line x1="158" y1="218" x2="244" y2="218" stroke="white" stroke-width="8" stroke-linecap="round" opacity="0.55"/>
  <line x1="158" y1="244" x2="222" y2="244" stroke="white" stroke-width="8" stroke-linecap="round" opacity="0.3"/>
</svg>
