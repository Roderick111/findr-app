name: Release

on:
  push:
    tags: ['v*']

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: oven-sh/setup-bun@v2

      - name: Read pinned findr version
        id: ver
        shell: bash
        run: echo "version=$(cat findr_version.txt | tr -d '[:space:]')" >> $GITHUB_OUTPUT

      - name: Fetch findr binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          mkdir -p src-tauri/binaries
          V=${{ steps.ver.outputs.version }}
          gh release download "$V" --repo Roderick111/findr \
            -p "findr-macos-arm64" -p "findr-macos-x86_64" \
            -p "findr-ocr-macos-universal" \
            -D /tmp/findr-bins
          cp /tmp/findr-bins/findr-macos-arm64 src-tauri/binaries/findr-aarch64-apple-darwin
          cp /tmp/findr-bins/findr-macos-x86_64 src-tauri/binaries/findr-x86_64-apple-darwin
          cp /tmp/findr-bins/findr-ocr-macos-universal src-tauri/binaries/findr-ocr-aarch64-apple-darwin
          cp /tmp/findr-bins/findr-ocr-macos-universal src-tauri/binaries/findr-ocr-x86_64-apple-darwin
          chmod +x src-tauri/binaries/*

      - name: Install frontend deps
        run: bun install

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "findr Desktop v__VERSION__"
          releaseBody: "Bundles findr CLI ${{ steps.ver.outputs.version }}."
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}
